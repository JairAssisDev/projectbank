server:
  port: 8081

spring:
  application:
    name: account-service
  threads:
    virtual:
      enabled: true          # Tomcat, @RabbitListener, @Scheduled e @Async em virtual threads
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/account_db
    username: account
    password: account
    hikari:
      maximum-pool-size: 30  # com virtual threads o pool de conexões vira o limitador real de concorrência
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none         # schema gerenciado pelo Flyway
  flyway:
    enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 20
        concurrency: 4
        max-concurrency: 32

bank:
  messaging:
    confirm-timeout-ms: 5000
    retry:
      max-attempts: 3
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
