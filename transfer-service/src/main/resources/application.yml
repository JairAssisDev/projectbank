server:
  port: 8082

spring:
  application:
    name: transfer-service
  threads:
    virtual:
      enabled: true          # Tomcat, @RabbitListener, @Scheduled (outbox relay) em virtual threads
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5434/transfer_db
    username: transfer
    password: transfer
    hikari:
      maximum-pool-size: 30
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 20
        concurrency: 4
        max-concurrency: 32

bank:
  security:
    # segredo HS256 compartilhado (>= 32 bytes). Em produção: variável de ambiente / secret manager
    jwt-secret: ${BANK_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  outbox:
    poll-interval-ms: 200
    batch-size: 100
  messaging:
    confirm-timeout-ms: 5000
    retry:
      max-attempts: 3
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
